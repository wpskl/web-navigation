<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页分类导航</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>导航</h1>
        <button id="btn-add-root" class="btn btn-primary btn-sm" title="添加顶级分类">+ 分类</button>
      </div>
      <div id="category-tree" class="category-tree"></div>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="搜索标题或标签..." autocomplete="off">
          <div id="search-tags" class="search-tags"></div>
        </div>
      </header>

      <div id="content-area" class="content-area">
        <div class="empty-state" id="empty-state">
          <p>← 选择或创建一个分类</p>
        </div>
        <div id="category-panel" class="category-panel hidden">
          <div class="panel-header">
            <h2 id="panel-title"></h2>
            <div class="panel-actions">
              <div class="view-toggle">
                <button class="view-btn active" data-mode="tile" title="平铺模式">▦ 平铺</button>
                <button class="view-btn" data-mode="card" title="卡片模式">▣ 卡片</button>
              </div>
            </div>
          </div>

          <div class="add-link-form">
            <input type="url" id="link-url" placeholder="输入网址，回车添加" autocomplete="off">
            <button id="btn-add-link" class="btn btn-primary">添加</button>
          </div>

          <div id="links-container" class="links-container tile-mode"></div>
        </div>

        <div id="search-results" class="search-results hidden"></div>
      </div>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <h3 id="modal-title">编辑</h3>
      <input type="text" id="modal-input" class="modal-input">
      <div class="modal-actions">
        <button id="modal-cancel" class="btn">取消</button>
        <button id="modal-confirm" class="btn btn-primary">确定</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
